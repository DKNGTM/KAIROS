<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · KAIROS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:wght@100..900&family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<div th:replace="~{fragmentos/header :: header('')}"></div>

<main class="auth-stage">
    <div class="auth-inner">
        <div class="auth-topbar">
            <a th:href="@{/feed}">[ ← VOLVER AL FEED PÚBLICO ]</a>
        </div>

        <div class="auth-title-block">
            <h1 class="auth-title">INICIAR SESIÓN</h1>
        </div>

        <div class="auth-card">

            <div class="auth-card__body">
                <div class="auth-tabs" role="tablist" aria-label="Acceso o registro">
                    <a class="auth-tab is-active" th:href="@{/auth/login}" aria-current="page">[ INICIAR SESIÓN ]</a>
                    <a class="auth-tab" th:href="@{/auth/registro}">[ CREAR CUENTA ]</a>
                </div>

                <form th:action="@{/auth/login}" method="post" class="stack-md" autocomplete="on">
                    <div class="field">
                        <label class="field__label" for="login-identifier">
                            <span>Correo o nombre de usuario</span>
                            <span class="req">* REQUERIDO</span>
                        </label>
                        <div class="input-icon-wrap">
                            <span class="material-symbols-outlined" aria-hidden="true">person</span>
                            <input id="login-identifier"
                                   type="text"
                                   name="identificador"
                                   th:value="${identificador}"
                                   placeholder="ej. satoshi@kairos.dev o @operator_9"
                                   autocomplete="username"
                                   required>
                        </div>
                    </div>

                    <div class="field">
                        <label class="field__label" for="login-key">
                            <span>Contraseña</span>
                        </label>
                        <div class="input-icon-wrap">
                            <span class="material-symbols-outlined" aria-hidden="true">key</span>
                            <input id="login-key"
                                   type="password"
                                   name="contrasena"
                                   placeholder="••••••••••••••••"
                                   autocomplete="current-password"
                                   required>
                            <button class="password-toggle" type="button"
                                    data-toggle-password="login-key"
                                    data-icon-target="login-key-icon"
                                    aria-label="Mostrar u ocultar contraseña">
                                <span class="material-symbols-outlined" id="login-key-icon">visibility</span>
                            </button>
                        </div>
                    </div>

                    <button class="auth-submit" type="submit">
                        <span>[ ENTRAR AL FEED ]</span>
                        <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span>
                    </button>

                    <div class="auth-switch">
                        <span>¿Todavía no tienes cuenta?</span>
                        <a class="auth-link" th:href="@{/auth/registro}">[ REGISTRARSE ]</a>
                    </div>
                </form>
            </div>
        </div>

        

        
        <!--cuentas demo: admin@kairos.dev / admin1234 · demo@kairos.dev / demo1234-->
            
    </div>
</main>

<footer th:replace="~{fragmentos/footer :: footer}"></footer>

<script>
    document.querySelectorAll('[data-toggle-password]').forEach(function (button) {
        button.addEventListener('click', function () {
            var input = document.getElementById(button.getAttribute('data-toggle-password'));
            var icon = document.getElementById(button.getAttribute('data-icon-target'));
            if (!input) return;
            var visible = input.type === 'password';
            input.type = visible ? 'text' : 'password';
            if (icon) icon.textContent = visible ? 'visibility_off' : 'visibility';
        });
    });
</script>

</body>
</html>
