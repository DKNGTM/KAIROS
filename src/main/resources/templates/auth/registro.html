<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta · KAIROS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:wght@100..900&family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<div th:replace="~{fragmentos/header :: header('')}"></div>

<main class="auth-stage">
    <div class="auth-inner">
        <div class="auth-topbar">
            <a th:href="@{/feed}">[ ← EXPLORAR SIN CUENTA ]</a>
        </div>

        <div class="auth-title-block">
            <h1 class="auth-title">REGISTRARSE</h1>
        </div>

        <div class="auth-card auth-card--register">

            <div class="auth-card__body">
                <div class="auth-tabs" role="tablist" aria-label="Acceso o registro">
                    <a class="auth-tab" th:href="@{/auth/login}">[ INICIAR SESIÓN ]</a>
                    <a class="auth-tab is-active" th:href="@{/auth/registro}" aria-current="page">[ CREAR CUENTA ]</a>
                </div>

                <form th:action="@{/auth/registro}"
                      th:object="${registro}"
                      method="post"
                      class="stack-md"
                      id="register-form"
                      autocomplete="on">

                    <div class="form-error" th:if="${#fields.hasGlobalErrors()}">
                        <span class="material-symbols-outlined" aria-hidden="true">warning</span>
                        <div>
                            <p th:each="error : ${#fields.globalErrors()}" th:text="${error}">
                                No se pudo completar el registro.
                            </p>
                        </div>
                    </div>

                    <div class="field" th:classappend="${#fields.hasErrors('nombreUsuario')} ? 'has-error'">
                        <label class="field__label" for="handle">
                            <span>Nombre de usuario</span>
                            <span class="req">* REQUERIDO</span>
                        </label>
                        <div class="input-icon-wrap">
                            <span class="input-at" aria-hidden="true">@</span>
                            <input id="handle"
                                   type="text"
                                   th:field="*{nombreUsuario}"
                                   placeholder="curador_01"
                                   autocomplete="username"
                                   required>
                        </div>
                        <p class="field__error" th:if="${#fields.hasErrors('nombreUsuario')}"
                           th:errors="*{nombreUsuario}">Nombre no válido.</p>
                    </div>

                    <div class="field" th:classappend="${#fields.hasErrors('correo')} ? 'has-error'">
                        <label class="field__label" for="email">
                            <span>Correo electrónico</span>
                            <span class="req">* REQUERIDO</span>
                        </label>
                        <div class="input-icon-wrap">
                            <span class="material-symbols-outlined" aria-hidden="true">alternate_email</span>
                            <input id="email"
                                   type="email"
                                   th:field="*{correo}"
                                   placeholder="terminal@kairos.io"
                                   autocomplete="email"
                                   required>
                        </div>
                        <p class="field__error" th:if="${#fields.hasErrors('correo')}"
                           th:errors="*{correo}">Correo no válido.</p>
                    </div>

                    <div class="field" th:classappend="${#fields.hasErrors('contrasena')} ? 'has-error'">
                        <label class="field__label" for="password">
                            <span>Contraseña</span>
                            <span class="field__hint" id="pwd-strength">Mín. 8 caracteres</span>
                        </label>
                        <div class="input-icon-wrap">
                            <span class="material-symbols-outlined" aria-hidden="true">key</span>
                            <input id="password"
                                   type="password"
                                   th:field="*{contrasena}"
                                   placeholder="••••••••••••"
                                   autocomplete="new-password"
                                   required>
                            <button class="password-toggle" type="button"
                                    data-toggle-password="password"
                                    data-icon-target="pwd-icon"
                                    aria-label="Mostrar u ocultar contraseña">
                                <span class="material-symbols-outlined" id="pwd-icon">visibility</span>
                            </button>
                        </div>
                        <div class="entropy" aria-hidden="true">
                            <div class="entropy__track">
                                <div class="entropy__bar" id="pwd-meter"></div>
                            </div>
                        </div>
                        <p class="field__error" th:if="${#fields.hasErrors('contrasena')}"
                           th:errors="*{contrasena}">Contraseña no válida.</p>
                    </div>

                    <div class="auth-row">
                        <label class="check">
                            <input type="checkbox" required>
                            Acepto las normas de la comunidad
                        </label>
                    </div>

                    <button class="auth-submit" type="submit">
                        <span>[ CREAR CUENTA ]</span>
                        <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span>
                    </button>

                    <div class="auth-switch">
                        <span>¿Ya tienes una cuenta?</span>
                        <a class="auth-link" th:href="@{/auth/login}">[ INICIAR SESIÓN ]</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragmentos/footer :: footer}"></footer>

<script>
    (function () {
        var pwdInput = document.getElementById('password');
        var meter = document.getElementById('pwd-meter');
        var strength = document.getElementById('pwd-strength');

        function actualizarMedidor(valor) {
            if (!meter || !strength) return;
            if (!valor) {
                meter.style.width = '0%';
                meter.style.background = 'var(--primary)';
                strength.textContent = 'Mín. 8 caracteres';
                strength.className = 'field__hint';
                return;
            }
            var score = 0;
            if (valor.length >= 8) score += 35;
            if (/[A-Z]/.test(valor) && /[a-z]/.test(valor)) score += 35;
            if (/[0-9]/.test(valor) || /[^A-Za-z0-9]/.test(valor)) score += 30;

            meter.style.width = score + '%';
            if (score < 40) {
                meter.style.background = 'var(--status-alert)';
                strength.textContent = 'SEGURIDAD: BAJA';
                strength.className = 'field__hint';
            } else if (score < 75) {
                meter.style.background = 'var(--status-pending)';
                strength.textContent = 'SEGURIDAD: MEDIA';
                strength.className = 'field__hint';
            } else {
                meter.style.background = 'var(--status-active)';
                strength.textContent = 'SEGURIDAD: ALTA';
                strength.className = 'field__hint';
            }
        }

        if (pwdInput) {
            pwdInput.addEventListener('input', function (event) {
                actualizarMedidor(event.target.value);
            });
            actualizarMedidor(pwdInput.value);
        }

        document.querySelectorAll('[data-toggle-password]').forEach(function (button) {
            button.addEventListener('click', function () {
                var input = document.getElementById(button.getAttribute('data-toggle-password'));
                var icon = document.getElementById(button.getAttribute('data-icon-target'));
                if (!input) return;
                var visible = input.type === 'password';
                input.type = visible ? 'text' : 'password';
                if (icon) icon.textContent = visible ? 'visibility_off' : 'visibility';
            });
        });
    })();
</script>

</body>
</html>
