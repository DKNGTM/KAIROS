spring.application.name=kairos

# ============================================================
# BASE DE DATOS (MySQL)
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/kairos_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
# La instalación local de MySQL usa la clave 31521; puede sobrescribirse con KAIROS_DB_PASSWORD.
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA & HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ============================================================
# SUBIDA DE ARCHIVOS (MULTIPART)
# ============================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB

# ============================================================
# KAIROS
# ============================================================
# Directorio físico donde se almacenan las imágenes de las ofertas.
kairos.uploads.dir=src/main/resources/static/images/uploads
# Carga de ofertas de demostración al arrancar (true/false).
kairos.seed-demo=true

# ============================================================
# SERVIDOR
# ============================================================
server.port=8081
server.error.include-message=always
spring.thymeleaf.cache=false

